  <rect x="90" y="470" width="1040" height="180" rx="24" fill="#FFFFFF" fill-opacity="0.75" stroke="#E2E8F0"/>
  <text x="130" y="530" fill="#0F172A" font-family="Verdana, sans-serif" font-size="24" font-weight="700">GIT FLOW SUMMARY</text>
  <text x="130" y="570" fill="#334155" font-family="Verdana, sans-serif" font-size="18">1. Edit files in project</text>
  <text x="130" y="604" fill="#334155" font-family="Verdana, sans-serif" font-size="18">2. Stage files with git add</text>
  <text x="470" y="570" fill="#334155" font-family="Verdana, sans-serif" font-size="18">3. Save history with git commit</text>
  <text x="470" y="604" fill="#334155" font-family="Verdana, sans-serif" font-size="18">4. Share to team with git push</text>
