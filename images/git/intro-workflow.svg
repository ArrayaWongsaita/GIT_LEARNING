<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="100" y1="80" x2="1100" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0E7490"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cardD" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="720" rx="36" fill="url(#bg)" />

  <g filter="url(#shadow)">
    <rect x="90" y="220" width="230" height="180" rx="20" fill="url(#cardA)"/>
    <rect x="360" y="220" width="230" height="180" rx="20" fill="url(#cardB)"/>
    <rect x="630" y="220" width="230" height="180" rx="20" fill="url(#cardC)"/>
    <rect x="900" y="220" width="230" height="180" rx="20" fill="url(#cardD)"/>
  </g>

  <text x="205" y="286" text-anchor="middle" fill="#E2E8F0" font-family="Verdana, sans-serif" font-size="20" font-weight="700">WORKING</text>
  <text x="205" y="314" text-anchor="middle" fill="#E2E8F0" font-family="Verdana, sans-serif" font-size="20" font-weight="700">DIRECTORY</text>

  <text x="475" y="286" text-anchor="middle" fill="#CFFAFE" font-family="Verdana, sans-serif" font-size="20" font-weight="700">STAGING</text>
  <text x="475" y="314" text-anchor="middle" fill="#CFFAFE" font-family="Verdana, sans-serif" font-size="20" font-weight="700">AREA</text>

  <text x="745" y="286" text-anchor="middle" fill="#D1FAE5" font-family="Verdana, sans-serif" font-size="20" font-weight="700">LOCAL</text>
  <text x="745" y="314" text-anchor="middle" fill="#D1FAE5" font-family="Verdana, sans-serif" font-size="20" font-weight="700">REPOSITORY</text>

  <text x="1015" y="286" text-anchor="middle" fill="#EDE9FE" font-family="Verdana, sans-serif" font-size="20" font-weight="700">REMOTE</text>
  <text x="1015" y="314" text-anchor="middle" fill="#EDE9FE" font-family="Verdana, sans-serif" font-size="20" font-weight="700">REPOSITORY</text>

  <text x="205" y="356" text-anchor="middle" fill="#94A3B8" font-family="Verdana, sans-serif" font-size="16">edit files</text>
  <text x="475" y="356" text-anchor="middle" fill="#A5F3FC" font-family="Verdana, sans-serif" font-size="16">git add</text>
  <text x="745" y="356" text-anchor="middle" fill="#A7F3D0" font-family="Verdana, sans-serif" font-size="16">git commit</text>
  <text x="1015" y="356" text-anchor="middle" fill="#C4B5FD" font-family="Verdana, sans-serif" font-size="16">git push</text>

  <line x1="322" y1="310" x2="352" y2="310" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="352,298 370,310 352,322" fill="#94A3B8"/>

  <line x1="592" y1="310" x2="622" y2="310" stroke="#0E7490" stroke-width="6" stroke-linecap="round"/>
  <polygon points="622,298 640,310 622,322" fill="#0E7490"/>

  <line x1="862" y1="310" x2="892" y2="310" stroke="#7C3AED" stroke-width="6" stroke-linecap="round"/>
