<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="100" y1="90" x2="1100" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="mainLine" x1="120" y1="430" x2="1080" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="featureLine" x1="350" y1="320" x2="900" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="1160" height="720" rx="36" fill="url(#bg2)" stroke="#E2E8F0"/>

  <text x="90" y="100" fill="#0F172A" font-family="Verdana, sans-serif" font-size="34" font-weight="700">BRANCH OVERVIEW</text>
  <text x="90" y="140" fill="#475569" font-family="Verdana, sans-serif" font-size="20">Develop features safely before merging to main</text>

  <line x1="120" y1="430" x2="1080" y2="430" stroke="url(#mainLine)" stroke-width="10" stroke-linecap="round"/>
  <line x1="350" y1="320" x2="900" y2="320" stroke="url(#featureLine)" stroke-width="10" stroke-linecap="round"/>
  <line x1="350" y1="430" x2="350" y2="320" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="900" y1="320" x2="900" y2="430" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <circle cx="220" cy="430" r="22" fill="#0EA5E9"/>
  <circle cx="350" cy="430" r="22" fill="#0EA5E9"/>
  <circle cx="560" cy="430" r="22" fill="#0EA5E9"/>
  <circle cx="900" cy="430" r="22" fill="#2563EB"/>
  <circle cx="1020" cy="430" r="22" fill="#2563EB"/>

  <circle cx="500" cy="320" r="22" fill="#F97316"/>
  <circle cx="680" cy="320" r="22" fill="#F97316"/>
  <circle cx="820" cy="320" r="22" fill="#EA580C"/>

  <text x="150" y="492" fill="#0369A1" font-family="Verdana, sans-serif" font-size="20" font-weight="700">main</text>
  <text x="460" y="282" fill="#C2410C" font-family="Verdana, sans-serif" font-size="20" font-weight="700">feature/introduction</text>

  <rect x="100" y="560" width="1000" height="140" rx="20" fill="#0F172A"/>
  <text x="140" y="618" fill="#E2E8F0" font-family="Verdana, sans-serif" font-size="20">1. create branch: git switch -c feature/introduction</text>
  <text x="140" y="652" fill="#E2E8F0" font-family="Verdana, sans-serif" font-size="20">2. commit on feature branch, then merge back to main</text>
</svg>
